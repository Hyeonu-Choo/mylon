<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mylon - 오프라인 플레이어</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <header>🎵 Mylon</header>

  <!-- 상단 탭 네비게이션 -->
  <div class="tab-nav">
    <button class="tab-btn active" onclick="switchTab('library')">모든 곡</button>
    <button class="tab-btn" onclick="switchTab('playlists')">플레이리스트</button>
  </div>

  <div class="container">
    <!-- 1. 모든 곡 탭 화면 -->
    <div id="libraryTab" class="tab-content active">
      <div style="margin-bottom: 16px;">
        <label style="font-size: 14px; font-weight: 600; display: block; margin-bottom: 6px;">기기에서 음악 파일 추가 (MP3 / M4A)</label>
        <input type="file" id="audioFileInput" accept="audio/*" multiple>
      </div>

      <h3>보관함 곡 목록</h3>
      <div id="songList"></div>
    </div>

    <!-- 2. 플레이리스트 탭 화면 -->
    <div id="playlistsTab" class="tab-content">
      <div class="playlist-create-box">
        <input type="text" id="playlistNameInput" placeholder="새 플레이리스트 이름 (예: 10km 러닝)">
        <button id="createPlaylistBtn">플레이리스트 생성</button>
      </div>
      <h3>내 플레이리스트</h3>
      <div id="playlistList"></div>
    </div>

    <!-- 3. 특정 플레이리스트 상세 화면 -->
    <div id="playlistDetailTab" class="tab-content" style="display:none;">
      <button class="back-btn" onclick="closePlaylistDetail()">⬅️ 목록으로 돌아가기</button>
      <h2 id="detailPlaylistTitle">플레이리스트</h2>
      <button id="playAllPlaylistBtn" style="margin-bottom: 12px; width:100%; padding: 12px; background: var(--accent-color); color:white; border:none; border-radius:8px; font-weight:600; cursor:pointer;">▶️ 전체 재생</button>
      <div id="detailSongList"></div>
    </div>
  </div>

  <!-- 하단 재생 컨트롤 바 -->
  <div class="player-bar" id="playerBar" style="display: none;">
    <div style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" id="nowPlayingTitle">재생 중인 곡 없음</div>
    <input type="range" id="progressBar" value="0" min="0" max="100" style="width: 100%;">
    <div class="player-controls">
      <button id="shuffleBtn" class="mode-btn" title="셔플">🔀</button>
      <button id="prevBtn" title="이전 곡">⏮️</button>
      <button id="playPauseBtn" style="font-size: 26px;" title="재생/일시정지">▶️</button>
      <button id="nextBtn" title="다음 곡">⏭️</button>
      <button id="repeatBtn" class="mode-btn active-mode" title="반복 모드">🔁</button>
    </div>
  </div>

  <audio id="audioElement"></audio>
  <script src="app.js"></script>
</body>
</html>
